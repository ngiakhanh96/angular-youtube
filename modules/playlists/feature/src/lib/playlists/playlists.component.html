<main class="playlists-page" aria-labelledby="playlists-title">
  <h1 class="playlist-title" id="playlists-title" #heading>Playlists</h1>
  @if (!auth.isLoggedIn()) {
    <div class="page-state">
      <h2>Your playlists, all in one place</h2>
      <p>Sign in to view and play your YouTube playlists.</p>
      <div class="sign-in-button">
        <ay-text-icon-button
          displayText="Sign in"
          color="#fff"
          backgroundColor="#0f0f0f"
          hoverBackgroundColor="#333"
          fontWeight="600"
          iconPaddingLeft="20px"
          iconPaddingRight="20px"
          (click)="auth.login()"
        />
      </div>
    </div>
  } @else {
    <div class="collection-bar">
      <ay-pill-list
        [videoCategories]="playlistCategories()"
        [scrollingWidth]="150"
      />
    </div>
    <div
      class="playlist-grid"
      ayInfiniteScroll
      [infiniteScrollDistance]="3"
      [infiniteScrollThrottle]="50"
      [infiniteScrollDisabled]="!store.nextPageToken()"
      (scrolled)="onScrollDown()"
    >
      <ng-template
        #playlistCard
        let-playlist="playlist"
        let-isSkeleton="isSkeleton"
      >
        <ay-playlist-card
          [playlist]="playlist"
          [isSkeleton]="isSkeleton"
          (openPlaylist)="openPlaylist($event)"
        />
      </ng-template>
      @for (playlist of store.playlists(); track playlist.id) {
        <div class="playlist-grid-item">
          @defer (on viewport; prefetch on idle) {
            <ng-container
              *ngTemplateOutlet="
                playlistCard;
                context: { playlist: playlist, isSkeleton: false }
              "
            />
          } @placeholder (minimum 500ms) {
            <div aria-hidden="true">
              <ng-container
                *ngTemplateOutlet="
                  playlistCard;
                  context: { playlist: playlist, isSkeleton: true }
                "
              />
            </div>
          }
        </div>
      }
    </div>
  }
</main>
