<div class="video-comment-container">
  <div class="video-comment-avatar">
    <img
      [ayImgSrc]="authorThumbnailUrl()"
      [width]="avatarWidthHeight()"
      [height]="avatarWidthHeight()"
      alt="Comment author avatar"
    />
  </div>
  <div class="video-comment-content">
    <div class="video-comment-header">
      <div class="video-comment-channel-name">
        <ay-channel-name
          [channelName]="comment().author"
          [isVerified]="comment().verified"
          [fontWeight]="'500'"
        ></ay-channel-name
      ></div>
      <div class="video-comment-time">{{ comment().publishedText }}</div>
    </div>
    <div
      class="video-comment-text"
      [innerHTML]="sanitizedCommentHtml()"
      #commentText
    >
    </div>
    <div class="video-comment-actions">
      <div class="video-comment-like-action">
        <ay-text-icon-button
          [displayText]="likeCountString()"
          [disabled]="!isUserLoggedIn()"
          [disabledRipple]="!isUserLoggedIn()"
          disabledBackgroundColor="transparent"
          disabledColor="rgb(96,96,96)"
          [svgIcon]="'dislike'"
          [transform]="'rotate(180deg)'"
          backgroundColor="transparent"
          hoverBackgroundColor="transparent"
          color="rgb(96,96,96)"
          [fontWeight]="'400'"
          [fontSize]="'12px'"
        >
        </ay-text-icon-button>
      </div>
      <div class="video-comment-dislike-action">
        <ay-text-icon-button
          [svgIcon]="'dislike'"
          [disabled]="!isUserLoggedIn()"
          [disabledRipple]="!isUserLoggedIn()"
          disabledBackgroundColor="transparent"
          disabledColor="rgb(96,96,96)"
          backgroundColor="transparent"
          hoverBackgroundColor="transparent"
          color="rgb(96,96,96)"
        >
        </ay-text-icon-button>
      </div>
      @if (isUserLoggedIn()) {
        <div class="video-comment-reply-action">
          <ay-text-icon-button
            #replyButton
            displayText="Reply"
            fontSize="13px"
            backgroundColor="transparent"
            color="var(--black-color)"
            (click)="openReply()"
            [ariaExpanded]="isReplyOpen()"
          />
        </div>
      }
    </div>
    @if (isUserLoggedIn() && isReplyOpen()) {
      <ay-comment-input
        [formField]="replyForm.text"
        [inputId]="replyInputId()"
        placeholder="Add a reply..."
        [inputLabel]="'Reply to ' + comment().author"
        submitLabel="Reply"
        [autoFocus]="true"
        [isSubmitting]="isSubmittingReply()"
        [error]="replyError()"
        (submitted)="submitReply($event)"
        (cancelled)="cancelReply()"
      />
    }
    @if (repliesCount() > 0) {
      <div class="video-comment-replies">
        <div class="video-comment-replies-count">
          <ay-text-icon-button
            [displayText]="repliesCountString()"
            [svgIcon]="'chevron-down'"
            color="var(--blue-color)"
            backgroundColor="transparent"
            hoverBackgroundColor="rgb(222,241,255)"
            [transform]="repliesCollapsed() ? 'rotate(0deg)' : 'rotate(180deg)'"
            (click)="onClickReplies()"
          >
          </ay-text-icon-button>
        </div>
        @if (!repliesCollapsed()) {
          <div class="video-comment-replies-list">
            @for (
              nestedComment of replies().comments;
              track nestedComment.comment.commentId
            ) {
              <ay-video-comment
                [commentViewModel]="nestedComment"
                [isUserLoggedIn]="isUserLoggedIn()"
                [avatarWidthHeight]="24"
              ></ay-video-comment>
            }
          </div>
          @if (hasMoreReplies()) {
            <div class="video-comment-replies-more">
              <ay-text-icon-button
                [displayText]="'Show more replies'"
                [svgIcon]="'enter'"
                color="var(--blue-color)"
                backgroundColor="transparent"
                hoverBackgroundColor="rgb(222,241,255)"
                (click)="onClickMoreReplies()"
              >
              </ay-text-icon-button>
            </div>
          }
        }
      </div>
    }
  </div>
</div>
