<div class="video-comments-container">
  <div class="video-comments-header">
    <div class="video-comments-total">{{ totalCommentsString() }}</div>
    <div class="video-comments-sort">
      <ay-text-icon-button
        svgIcon="sort-by"
        displayText="Sort by"
        color="var(--black-color)"
        backgroundColor="transparent"
        hoverBackgroundColor="transparent"
        borderRadius="0px"
        svgIconMarginLeft="0px"
        svgIconMarginRight="12px"
        iconPaddingLeft="0px"
        iconPaddingRight="0px"
        cdkOverlayOrigin
        #sortOrigin="cdkOverlayOrigin"
      />
    </div>
  </div>

  @if (auth.isLoggedIn() && user()?.items?.length) {
    <ay-comment-input
      [formField]="form.commentInput"
      inputId="commentInput"
      [avatarUrl]="userThumbnail()"
      [isSubmitting]="isSubmitting()"
      [submitDisabled]="!channelId()"
      [error]="submissionError()"
      (submitted)="submitComment($event)"
      (cancelled)="cancelComment()"
    />
  }

  <div class="video-comments-list">
    @for (
      commentViewModel of commentViewModels();
      track commentViewModel.comment.commentId
    ) {
      @defer (on viewport; prefetch on idle) {
        <ay-video-comment
          [commentViewModel]="commentViewModel"
          [isUserLoggedIn]="auth.isLoggedIn()"
          [currentUserAvatarUrl]="userThumbnail()"
        ></ay-video-comment>
      } @placeholder {
        <div class="video-comment-placeholder" aria-hidden="true"></div>
      }
    }
  </div>
</div>

<ng-template
  ayOverlay
  [connectedOverlayOrigin]="sortOrigin"
  [connectedOverlayWidth]="'min(300px, calc(100vw - 32px))'"
  [(connectedOverlayOpen)]="isSortOpen"
>
  <div
    class="video-comments-sort-menu"
    (keydown.escape)="isSortOpen.set(false); $event.stopPropagation()"
  >
    @for (option of sortOptions; track option.value) {
      <label class="video-comments-sort-option">
        <input
          type="radio"
          [value]="option.value"
          class="sr-only"
          [formField]="form.selectedSort"
          (click)="selectSort(option.value)"
          (change)="selectSort(option.value)"
        />
        <span class="video-comments-sort-label">{{ option.label }}</span>
        <span class="video-comments-sort-description">
          {{ option.description }}
        </span>
      </label>
    }
  </div>
</ng-template>
